name: build-watch-apk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build watch-optimized APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.16.0
        id: flutter-action
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get
        shell: bash

      - name: Remove build id (jni cmake workaround)
        run: sed -i -e 's/-Wl,/-Wl,--build-id=none,/' ${{ steps.flutter-action.outputs.PUB-CACHE-PATH }}/hosted/pub.dev/jni-*/src/CMakeLists.txt || true
        shell: bash

      - name: Build APKs (32-bit + 64-bit)
        run: flutter build apk --release --split-per-abi
        shell: bash

      - name: Collect outputs
        run: |
          mkdir -p out
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk out/kazumi-watch-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk out/kazumi-watch-arm64.apk
          ls -la out/
        shell: bash

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kazumi-watch-apks
          path: out/*.apk
          retention-days: 30
